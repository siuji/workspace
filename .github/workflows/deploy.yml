# Publica o site no GitHub Pages a cada push na branch main.
# Build e publicação em jobs separados (padrão oficial): evita a corrida em que o
# deploy procura o pacote do site antes de ele estar disponível.
name: Publicar workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cancel_sha:
        description: 'Commit de uma publicação travada para cancelar antes de publicar (opcional)'
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancelar publicação travada
        if: ${{ inputs.cancel_sha != '' && inputs.cancel_sha != null }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/deployments/${{ inputs.cancel_sha }}/cancel"
      - id: deployment
        uses: actions/deploy-pages@v4
